<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisa tu correo · Cuotas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .page{display:flex;align-items:center;justify-content:center;}
  .shell.narrow{text-align:center;display:flex;flex-direction:column;align-items:center;}
  .icon-circle{width:56px;height:56px;border-radius:16px;background:var(--surface2);border:1.5px solid var(--border);
              display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:22px;}
  h1{font-size:25px;margin:0 0 10px;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 6px;line-height:1.5;max-width:36ch;}
  .email{font-family:var(--font-head);font-size:14px;color:var(--ink);margin:0 0 28px;font-weight:600;}
  .foot-link{font-size:13px;color:var(--muted);margin-top:16px;}
  .link{color:var(--bg-deep);font-weight:600;}
  .devnote{margin-top:32px;padding:12px 16px;border-radius:var(--radius-sm);background:var(--surface2);
           border-left:3px solid var(--red);font-size:12px;color:var(--muted);text-align:left;line-height:1.5;width:100%;}
</style>
</head>
<body>
<div class="page">
  <div class="shell narrow">
    <div class="icon-circle">✉</div>
    <p class="eyebrow">Correo enviado</p>
    <h1>Revisá tu correo</h1>
    <p class="sub">Te enviamos un enlace para elegir una nueva contraseña a</p>
    <p class="email">tu@correo.com</p>

    <button type="button" class="pill ghost block">Abrir correo</button>

    <p class="foot-link">¿No llegó? <a class="link" href="#">Reenviar enlace</a></p>
    <p class="foot-link"><a class="link" href="login.html">← Volver a iniciar sesión</a></p>

    <div class="devnote">Esta pantalla enlaza a <strong style="color:var(--ink)">nueva-clave.html</strong>, que simula lo que vería la persona al tocar el enlace del correo. <a class="link" href="nueva-clave.html">Ver esa vista →</a></div>
  </div>
</div>
</body>
</html>
