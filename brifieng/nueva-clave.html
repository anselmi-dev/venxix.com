<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nueva contraseña · Cuotas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .page{display:flex;align-items:center;justify-content:center;}
  .icon-circle{width:44px;height:44px;border-radius:12px;background:var(--surface2);border:1.5px solid var(--border);
              display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:18px;}
  h1{font-size:25px;margin:0 0 8px;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 26px;line-height:1.5;max-width:36ch;}
  .reqs{list-style:none;padding:0;margin:0 0 22px;display:flex;flex-direction:column;gap:8px;}
  .reqs li{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);}
  .reqs li .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;}
  .foot-link{text-align:center;font-size:13px;color:var(--muted);margin-top:24px;}
  .link{color:var(--bg-deep);font-weight:600;}
</style>
</head>
<body>
<div class="page">
  <div class="shell narrow">
    <div class="icon-circle">🔒</div>
    <p class="eyebrow">Último paso</p>
    <h1>Elegí una nueva contraseña</h1>
    <p class="sub">Definí una contraseña nueva para tu cuenta. Vas a usarla la próxima vez que inicies sesión.</p>

    <form>
      <div class="field">
        <label for="pass">Nueva contraseña</label>
        <input type="password" id="pass" placeholder="••••••••">
      </div>
      <div class="field">
        <label for="pass2">Confirmar nueva contraseña</label>
        <input type="password" id="pass2" placeholder="••••••••">
      </div>

      <ul class="reqs">
        <li><span class="dot"></span>Al menos 8 caracteres</li>
        <li><span class="dot"></span>Una letra mayúscula</li>
        <li><span class="dot"></span>Un número</li>
      </ul>

      <a href="login.html"><button type="button" class="pill block">Guardar contraseña</button></a>
    </form>

    <p class="foot-link"><a class="link" href="login.html">← Volver a iniciar sesión</a></p>
  </div>
</div>
</body>
</html>
