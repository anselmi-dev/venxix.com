<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Cuotas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .page{display:flex;align-items:center;justify-content:center;}
  .auth-wrap{max-width:900px;width:100%;background:var(--surface);border-radius:var(--radius-xl);
            box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:1fr 1fr;}
  @media (max-width:760px){ .auth-wrap{grid-template-columns:1fr;} .visual{display:none;} }

  .visual{background:var(--bg);padding:44px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
  .visual .blob{width:220px;height:220px;top:-40px;right:-60px;opacity:.6;}
  .visual .logo{font-family:var(--font-head);font-weight:700;font-size:19px;z-index:1;}
  .visual .quote{font-family:var(--font-head);font-weight:600;font-size:26px;line-height:1.35;z-index:1;}
  .visual .foot-note{font-size:12px;color:#3c3110;z-index:1;}
  .mock{position:relative;z-index:1;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px;
       box-shadow:6px 6px 0 rgba(22,22,22,.12);width:210px;}
  .mock .bar{display:flex;gap:4px;margin-bottom:8px;}
  .mock .bar i{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--ink);}
  .mock .row{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--border);font-size:10px;}
  .mock .row:first-of-type{border-top:none;}

  .form-col{padding:44px;display:flex;flex-direction:column;justify-content:center;}
  h1{font-size:27px;margin:0 0 8px;}
  .sub{color:var(--muted);font-size:14px;margin:0 0 26px;line-height:1.5;}
  .row-between{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:22px;}
  .link{color:var(--bg-deep);font-weight:600;}
  .divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:22px 0;}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}
  .foot-link{text-align:center;font-size:13px;color:var(--muted);margin-top:24px;}
</style>
</head>
<body>
<div class="page">
  <div class="auth-wrap">

    <div class="visual">
      <div class="blob"></div>
      <div class="logo"><span class="dot" style="background:#171717;width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:8px;"></span>Cuotas</div>
      <div>
        <p class="quote">Todas tus tarjetas, todas tus cuotas, en un solo lugar.</p>
      </div>
      <div class="mock">
        <div class="bar"><i></i><i></i><i></i></div>
        <div class="row"><span>Fotostanisic</span><span>$ 3.936</span></div>
        <div class="row"><span>Wikimusculos</span><span>$ 1.660</span></div>
      </div>
      <p class="foot-note">$ 30.093 en cuotas gestionadas este mes</p>
    </div>

    <div class="form-col">
      <p class="eyebrow">Bienvenido de vuelta</p>
      <h1>Iniciar sesión</h1>
      <p class="sub">Ingresá con tu cuenta para ver tus tarjetas y cuotas.</p>

      <form>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="tu@correo.com">
        </div>
        <div class="field">
          <label for="pass">Contraseña</label>
          <input type="password" id="pass" placeholder="••••••••">
        </div>

        <div class="row-between">
          <label class="checkbox"><input type="checkbox"> Recordarme</label>
          <a class="link" href="recuperar.html">¿Olvidaste tu contraseña?</a>
        </div>

        <a href="tarjetas.html"><button type="button" class="pill block">Iniciar sesión</button></a>
      </form>

      <div class="divider">o</div>
      <button type="button" class="pill ghost block">Continuar con Google</button>

      <p class="foot-link">¿No tenés cuenta? <a class="link" href="register.html">Creá una</a></p>
    </div>

  </div>
</div>
</body>
</html>
