<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agregar tarjeta · Cuotas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .page{display:flex;align-items:center;justify-content:center;}
  .steps{display:flex;gap:6px;margin-bottom:26px;}
  .steps i{width:26px;height:4px;border-radius:4px;background:var(--border);display:block;}
  .steps i.on{background:var(--bg-deep);}
  h1{font-size:24px;margin:0 0 8px;}
  .sub{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:26px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:420px){ .grid2{grid-template-columns:1fr;} }

  .type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
  .type-card{position:relative;}
  .type-card input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0;}
  .type-card .box{border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px;text-align:center;
                  font-size:13px;background:var(--surface2);}
  .type-card input:checked + .box{border-color:var(--bg-deep);background:#fef8e0;font-weight:600;}

  .foot-link{text-align:center;font-size:13px;color:var(--muted);margin-top:20px;}
  .link{color:var(--bg-deep);font-weight:600;}
</style>
</head>
<body>
<div class="page">
  <div class="shell narrow">
    <div class="steps"><i class="on"></i><i class="on"></i><i></i></div>

    <p class="eyebrow">Paso 2 de 3</p>
    <h1>Agregá tu primera tarjeta</h1>
    <p class="sub">Con el nombre y los últimos dígitos alcanza para empezar. Podés sumar más después.</p>

    <form>
      <div class="field">
        <label for="banco">Banco o emisor</label>
        <input type="text" id="banco" placeholder="Ej. Santander, Itaú, BROU...">
      </div>

      <div class="grid2">
        <div class="field">
          <label for="alias">Alias de la tarjeta</label>
          <input type="text" id="alias" placeholder="Ej. Tarjeta principal">
        </div>
        <div class="field">
          <label for="last4">Últimos 4 dígitos</label>
          <input type="text" id="last4" maxlength="4" placeholder="1796">
        </div>
      </div>

      <label class="field" style="margin-bottom:8px;">
        <span style="font-size:12px;color:var(--muted);font-weight:500;">Tipo</span>
      </label>
      <div class="type-grid">
        <label class="type-card"><input type="radio" name="tipo" checked><div class="box">Crédito</div></label>
        <label class="type-card"><input type="radio" name="tipo"><div class="box">Débito</div></label>
      </div>

      <a href="onboarding-3.html"><button type="button" class="pill block">Continuar</button></a>
    </form>

    <p class="foot-link"><a class="link" href="onboarding-3.html">Saltear este paso →</a></p>
  </div>
</div>
</body>
</html>
